name: Cleanup merged branches

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const fullName = `${owner}/${repo}`;
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "closed",
              per_page: 100,
            });

            const branches = new Set(
              pullRequests
                .filter(pr => pr.merged_at)
                .filter(pr => pr.head.repo && pr.head.repo.full_name === fullName)
                .map(pr => pr.head.ref)
                .filter(ref => ref && ref !== "main")
                .filter(ref => ref.startsWith("feat/") || ref.startsWith("fix/") || ref.startsWith("chore/"))
            );

            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                core.info(`Deleted merged branch: ${branch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Branch already absent or protected: ${branch}`);
                  continue;
                }
                throw error;
              }
            }
